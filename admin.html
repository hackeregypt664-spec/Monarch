<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم الادمن</title>
<style>
body{font-family:sans-serif;background:#0f0f0f;color:#fff;padding:20px}
.card{background:#222;padding:15px;margin:10px 0;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
button{background:#ff0040;color:#fff;border:0;padding:10px 15px;border-radius:8px;cursor:pointer;font-weight:bold}
button:hover{background:#ff3366}
#loginBox{max-width:400px;margin:100px auto;background:#1e1e1e;padding:30px;border-radius:15px;text-align:center}
#loginBox input{width:100%;padding:12px;margin:15px 0;border-radius:8px;border:0;background:#2a2a2a;color:#fff;box-sizing:border-box}
#adminPanel{display:none}
</style>
</head>
<body>

<div id="loginBox">
  <h2>🔐 دخول الادمن</h2>
  <input type="password" id="pass" placeholder="اكتب الباسورد">
  <button onclick="login()" style="width:100%">دخول</button>
  <p id="err" style="color:#ff0040;display:none;margin-top:10px">الباسورد غلط</p>
</div>

<div id="adminPanel">
  <h2>🗑️ لوحة تحكم الادمن - مسح عن الكل</h2>
  <div id="list">بيحمل...</div>
</div>

<script>
const DB = "https://novels-app-2f35b-default-rtdb.firebaseio.com/novels";
const ADMIN_PASSWORD = "123456"; // غير الباسورد ده لباسورد قوي

function login(){
  if(document.getElementById('pass').value === ADMIN_PASSWORD){
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    load();
  } else {
    document.getElementById('err').style.display = 'block';
  }
}

async function load(){
  document.getElementById("list").innerHTML = "بيحمل...";
  try {
    let res = await fetch(DB+".json");
    let data = await res.json();
    if(!data){
      document.getElementById("list").innerHTML = "مفيش روايات";
      return;
    }
    let html = "";
    for(let id in data){
      let n = data[id];
      let title = n.title || 'بدون عنوان';
      let author = n.author || 'مجهول';
      html += `<div class="card"><span>${escapeHtml(title)} - ${escapeHtml(author)}</span><button onclick="del('${id}')">مسح عن الكل</button></div>`;
    }
    document.getElementById("list").innerHTML = html;
  } catch(e){
    document.getElementById("list").innerHTML = "خطأ في التحميل";
  }
}

function escapeHtml(text){
  let div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

async function del(id) {
  if(!confirm('متأكد عايز تمسح الرواية دي عن الكل؟ هتتمسح نهائي!')) return;
  
  try {
    await fetch(`${DB}/${id}.json`, { method: 'DELETE' });
    alert('اتمسحت من عند الكل ✅');
    load();
  } catch(e){
    alert('حصل خطأ، اتأكد من النت');
  }
}

// دخول بالانتر
document.getElementById('pass').addEventListener('keypress', function(e){
  if(e.key === 'Enter') login();
});
</script>
</body>
</html>
