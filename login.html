<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دخول الهانترز - Monarch</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
*{font-family:'Cairo';box-sizing:border-box}
body{background:#08080f;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:linear-gradient(145deg, rgba(24,24,40,0.9), rgba(15,15,25,0.9));padding:28px;border-radius:22px;width:95%;max-width:380px;border:1px solid rgba(109,40,217,0.3);text-align:center}
h2{color:#a78bfa;margin-bottom:15px}
input{width:100%;padding:13px;margin:7px 0;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.4);color:#fff}
button{width:100%;padding:13px;background:linear-gradient(90deg,#6d28d9,#38bdf8);border:0;border-radius:12px;color:#fff;font-weight:900;margin-top:10px;cursor:pointer}
.tabs{display:flex;gap:8px;margin-bottom:15px}
.tab{flex:1;padding:8px;border-radius:10px;background:rgba(255,255,255,0.05);color:#94a3b8;cursor:pointer;border:1px solid rgba(255,255,255,0.06)}
.tab.active{background:linear-gradient(90deg,#6d28d9,#38bdf8);color:#fff}
a{color:#64748b;text-decoration:none;font-size:12px;display:block;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<h2>🔐 بوابة الهانترز</h2>
<div class="tabs">
<div id="t-login" class="tab active" onclick="switchTab('login')">دخول</div>
<div id="t-reg" class="tab" onclick="switchTab('reg')">حساب جديد</div>
</div>
<input id="name" placeholder="اسمك" style="display:none"/>
<input id="email" type="email" placeholder="الايميل"/>
<input id="pass" type="password" placeholder="كلمة السر *"/>
<button id="mainBtn" onclick="handleAuth()">دخول 👑</button>
<a href="index.html">← رجوع للمكتبة</a>
<p id="msg" style="color:#ef4444;font-size:12px;margin-top:10px"></p>
</div>
<script>
let mode='login';
function switchTab(m){
 mode=m;
 document.getElementById('t-login').classList.toggle('active',m=='login');
 document.getElementById('t-reg').classList.toggle('active',m=='reg');
 document.getElementById('name').style.display=m=='reg'?'block':'none';
 document.getElementById('mainBtn').innerText=m=='reg'?'انشاء حساب 👑':'دخول 👑';
}
function handleAuth(){
 let n=document.getElementById('name').value.trim();
 let e=document.getElementById('email').value.trim();
 let p=document.getElementById('pass').value.trim();
 let msg=document.getElementById('msg');
 if(!e||!p) return msg.innerText='اكتب الايميل والباسورد';
 let users=JSON.parse(localStorage.getItem('monarch_users')||'{}');
 if(mode=='reg'){
   if(!n) return msg.innerText='اكتب اسمك';
   if(users[e]) return msg.innerText='الايميل ده موجود قبل كده';
   users[e]={name:n,email:e,pass:p,id:Date.now()};
   localStorage.setItem('monarch_users',JSON.stringify(users));
   localStorage.setItem('monarch_user',JSON.stringify(users[e]));
   location.href='index.html';
 } else {
   if(!users[e] || users[e].pass!==p) return msg.innerText='الايميل او الباسورد غلط';
   localStorage.setItem('monarch_user',JSON.stringify(users[e]));
   location.href='index.html';
 }
}
</script>
</body>
</html>
