<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monarch Gate</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
*{font-family:'Cairo', sans-serif}
body{background:#08080f;color:#fff;padding:20px;min-height:100vh}
.card{
 background:linear-gradient(145deg, rgba(24,24,40,0.9), rgba(15,15,25,0.9));
 border:1px solid rgba(255,255,255,0.06);padding:16px;margin:12px 0;border-radius:16px;
 display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap
}
.card img{width:60px;height:80px;object-fit:cover;border-radius:10px;border:1px solid rgba(109,40,217,0.3)}
button{border:0;padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px;transition:0.2s}
.btn-del{background:#ef4444;color:#fff}.btn-del:hover{background:#dc2626}
.btn-up{background:linear-gradient(90deg,#a78bfa,#38bdf8);color:#fff}
.btn-view{background:rgba(255,255,255,0.08);color:#94a3b8}
#loginBox{max-width:400px;margin:80px auto;background:linear-gradient(145deg, rgba(24,24,40,0.9), rgba(15,15,25,0.9));border:1px solid rgba(109,40,217,0.3);padding:30px;border-radius:24px;text-align:center;box-shadow:0 0 60px rgba(109,40,217,0.15)}
#loginBox input{width:100%;padding:14px;margin:15px 0;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:rgba(0,0,0,0.4);color:#fff;box-sizing:border-box}
#adminPanel{display:none;max-width:950px;margin:0 auto}
.stat{display:inline-block;background:rgba(109,40,217,0.1);border:1px solid rgba(109,40,217,0.2);padding:8px 14px;border-radius:20px;margin:5px;font-size:13px;color:#a78bfa}
.bookmark-list{font-size:11px;color:#64748b;background:rgba(0,0,0,0.3);padding:6px 10px;border-radius:8px;margin-top:6px}
.tab-active{background:linear-gradient(90deg,#a78bfa,#38bdf8) !important;color:#fff !important}
</style>
</head>
<body>

<div id="loginBox">
  <h2 style="color:#a78bfa">🔐 بوابة المونارك السرية</h2>
  <p style="color:#475569;font-size:12px;margin:8px 0">ممنوع الدخول لغير الملك</p>
  <input type="password" id="pass" placeholder="كلمة السر">
  <button onclick="login()" style="width:100%;padding:14px;background:linear-gradient(90deg,#6d28d9,#38bdf8);color:#fff;border-radius:12px;margin-top:10px">فتح البوابة 👑</button>
  <p id="err" style="color:#ef4444;display:none;margin-top:12px;font-size:13px">الباسورد غلط يا هانتر</p>
</div>

<div id="adminPanel">
  <h2 style="color:#a78bfa">👑 لوحة تحكم المونارك المطورة</h2>
  <div id="stats" style="margin:10px 0"></div>
  
  <div style="display:flex;gap:8px;margin:20px 0;flex-wrap:wrap">
   <button onclick="showTab('novels')" id="tab-novels" class="btn-up">📚 الروايات</button>
   <button onclick="showTab('users')" id="tab-users" class="btn-view">👥 المستخدمين</button>
   <button onclick="showTab('logs')" id="tab-logs" class="btn-view">📝 سجل الدخول</button>
  </div>

  <div id="novelsTab">
    <div style="display:flex;gap:8px;margin:15px 0">
     <input id="search" placeholder="ابحث عن رواية او كاتب..." oninput="filterList()" style="flex:1;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:rgba(0,0,0,0.4);color:#fff">
     <button onclick="load()" style="background:rgba(255,255,255,0.08);color:#fff">تحديث</button>
     <button onclick="clearAllBookmarks()" style="background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.3)">مسح علامات 🔖</button>
    </div>
    <div id="list">بيحمل...</div>
  </div>

  <div id="usersTab" style="display:none">
    <div id="usersList">بيحمل...</div>
  </div>

  <div id="logsTab" style="display:none">
    <div id="logsList">بيحمل...</div>
  </div>

  <p style="text-align:center;margin-top:30px"><a href="index.html" style="color:#475569;text-decoration:none;font-size:12px">← رجوع للمكتبة</a></p>
</div>

<script>
const DB = "https://novels-app-2f35b-default-rtdb.firebaseio.com/novels";
const DB_USERS = "https://novels-app-2f35b-default-rtdb.firebaseio.com/users";
const _0xhash = "8dac5b26a847a6624d3c781e50db4181f2090c855d34e68c250374a6b8dd6f91";

async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

let allData = {};
let allIds = [];
let currentTab = 'novels';

async function login(){
  const val = document.getElementById('pass').value;
  if(!val) return;
  const h = await sha256(val);
  if(h === _0xhash || val === "monarch77@S") {
    localStorage.setItem('monarch_gate','true');
    document.getElementById('loginBox').style.display='none';
    document.getElementById('adminPanel').style.display='block';
    load();
  } else {
    document.getElementById('err').style.display='block';
  }
}

if(localStorage.getItem('monarch_gate')==='true'){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('adminPanel').style.display='block';
  load();
}

async function load(){
  document.getElementById("list").innerHTML="بيحمل...";
  try{
    let res=await fetch(DB+".json"); let data=await res.json();
    if(!data){ document.getElementById("list").innerHTML="مفيش روايات"; return; }
    allData=data; allIds=Object.keys(data);
    let bmCount = 0;
    for(let i=0;i<localStorage.length;i++){ if(localStorage.key(i).startsWith('bookmark_')) bmCount++; }
    document.getElementById("stats").innerHTML=`
      <span class="stat">📚 ${allIds.length} رواية</span>
      <span class="stat">❤️ ${Object.values(data).reduce((s,n)=>s+(n.likes||0),0)} لايك</span>
      <span class="stat">🔖 ${bmCount} علامة</span>
      <span class="stat">👁️ ${Object.values(data).reduce((s,n)=>s+(n.views||0),0)} مشاهدة</span>
      <span class="stat" id="usersCountStat">👥 يحمل...</span>
    `;
    render(allIds);
    // حمل عدد المستخدمين
    let uRes = await fetch(DB_USERS+".json"); let uData = await uRes.json();
    if(uData) document.getElementById('usersCountStat').innerText = `👥 ${Object.keys(uData).length} مستخدم`;
  }catch(e){ document.getElementById("list").innerHTML="خطأ في التحميل"; }
}

function render(ids){
  let html="";
  for(let id of ids){
    let n=allData[id];
    let contentLength = n.content ? (n.content.length/1000).toFixed(1)+'K' : '0';
    html+=`<div class="card" data-title="${(n.title+' '+(n.author||'')).toLowerCase()}">
      <img src="${n.cover||''}" onerror="this.src='https://via.placeholder.com/60x80?text=No'">
      <div style="flex:1">
        <div style="font-weight:700;color:#e2e8f0">${escapeHtml(n.title||'بدون عنوان')} <span style="color:#64748b;font-size:11px">(${n.likes||0}❤️)</span></div>
        <div style="color:#64748b;font-size:12px">✍️ ${escapeHtml(n.author||'مجهول')} - 📄 ${contentLength}</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn-view" onclick="window.open('read.html?id=${id}','_blank')">عرض</button>
        <button class="btn-up" onclick="promote('${id}')">👑</button>
        <button class="btn-del" onclick="del('${id}')">مسح</button>
      </div>
    </div>`;
  }
  document.getElementById("list").innerHTML=html||"مفيش نتائج";
}

async function showTab(t){
 currentTab=t;
 document.getElementById('novelsTab').style.display = t=='novels'?'block':'none';
 document.getElementById('usersTab').style.display = t=='users'?'block':'none';
 document.getElementById('logsTab').style.display = t=='logs'?'block':'none';
 document.getElementById('tab-novels').className = t=='novels'?'btn-up':'btn-view';
 document.getElementById('tab-users').className = t=='users'?'btn-up':'btn-view';
 document.getElementById('tab-logs').className = t=='logs'?'btn-up':'btn-view';
 if(t=='users') loadUsers();
 if(t=='logs') loadLogs();
}

async function loadUsers(){
 document.getElementById('usersList').innerHTML="بيحمل المستخدمين...";
 try{
  let res = await fetch(DB_USERS+".json"); let data = await res.json();
  if(!data){ document.getElementById('usersList').innerHTML="مفيش مستخدمين لسه - لسه محدش سجل بعد التحديث"; return; }
  let arr = Object.entries(data).filter(([k,v])=>!v.action).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
  let html = "";
  for(let [id,u] of arr){
    html += `<div class="card">
      <div>
        <div style="color:#e2e8f0;font-weight:700">👤 ${escapeHtml(u.name||'بدون اسم')}</div>
        <div style="color:#94a3b8;font-size:13px">📧 ${escapeHtml(u.email||'')}</div>
        <div style="color:#475569;font-size:11px">🕒 ${new Date(u.createdAt||Date.now()).toLocaleString('ar-EG')} - ID: ${u.id||''}</div>
      </div>
      <div><span class="stat">جديد ✨</span></div>
    </div>`;
  }
  document.getElementById('usersList').innerHTML = html + `<p style="color:#64748b;font-size:12px">الاجمالي: ${arr.length} مستخدم مسجل</p>`;
 }catch(e){ document.getElementById('usersList').innerHTML="خطأ"; }
}

async function loadLogs(){
 document.getElementById('logsList').innerHTML="بيحمل السجل...";
 try{
  let res = await fetch(DB_USERS+".json"); let data = await res.json();
  if(!data) return;
  let arr = Object.entries(data).filter(([k,v])=>v.action=='login').sort((a,b)=>(b[1].time||0)-(a[1].time||0)).slice(0,50);
  let html = "";
  for(let [id,u] of arr){
    html += `<div class="card" style="padding:12px">
      <div style="color:#94a3b8;font-size:12px">📧 ${escapeHtml(u.email||'')} - ${escapeHtml(u.name||'')} - 🕒 ${new Date(u.time).toLocaleString('ar-EG')}</div>
      <span class="stat">دخول</span>
    </div>`;
  }
  document.getElementById('logsList').innerHTML = html || "مفيش سجل دخول";
 }catch(e){ document.getElementById('logsList').innerHTML="خطأ"; }
}

function filterList(){
  const q=document.getElementById('search').value.toLowerCase();
  const filtered=allIds.filter(id=> (allData[id].title+' '+(allData[id].author||'')).toLowerCase().includes(q) );
  render(filtered);
}
function escapeHtml(text){ let d=document.createElement('div'); d.textContent=text; return d.innerHTML; }
async function del(id){
  if(!confirm('هتمسح الرواية دي عن الكل نهائي؟')) return;
  await fetch(`${DB}/${id}.json`,{method:'DELETE'});
  alert('اتمسحت ✅'); load();
}
async function promote(id){
  if(!confirm('ترقي الرواية دي لـ Monarch 👑 ؟')) return;
  await fetch(`${DB}/${id}.json`,{method:'PATCH',body:JSON.stringify({rank:'MONARCH', likes:200})});
  alert('بقت Monarch 👑'); load();
}
function clearAllBookmarks(){
  if(!confirm('هتمسح كل علامات القراءة المحفوظة عندك؟')) return;
  let toDel=[]; for(let i=0;i<localStorage.length;i++){ let k=localStorage.key(i); if(k.startsWith('bookmark_')||k.startsWith('progress_')) toDel.push(k); }
  toDel.forEach(k=>localStorage.removeItem(k)); alert(`تم مسح ${toDel.length}`); load();
}
document.getElementById('pass').addEventListener('keypress',e=>{ if(e.key==='Enter') login(); });
</script>
</body>
</html>
