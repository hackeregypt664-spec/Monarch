<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monarch - نشر رواية</title>
<link rel="stylesheet" href="style.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
*{font-family:'Cairo', sans-serif}
body{background:#08080f !important;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{
 background: linear-gradient(145deg, rgba(24,24,40,0.9), rgba(15,15,25,0.9));
 backdrop-filter: blur(20px);
 border:1px solid rgba(109,40,217,0.3);
 border-radius:24px;
 padding:30px;
 width:100%;
 max-width:620px;
 box-shadow: 0 0 60px rgba(109,40,217,0.15), inset 0 1px 0 rgba(255,255,255,0.05);
}
.title{
 font-size:32px !important;font-weight:900;text-align:center;
 color:#a78bfa;
 text-shadow: 0 0 20px rgba(167,139,250,0.4);
 margin-bottom:5px !important
}
.subtitle{text-align:center;color:#64748b;font-size:14px;margin-bottom:25px}
label{color:#94a3b8;font-size:13px;margin:8px 4px 0 0;display:block}
input, textarea, select{
 width:100%;padding:14px 16px;margin:6px 0 12px 0;border-radius:12px;
 border:1px solid rgba(255,255,255,0.08);background:rgba(0,0,0,0.4);
 color:#fff;box-sizing:border-box;transition:0.3s;font-size:14px
}
input:focus, textarea:focus, select:focus{outline:none;border-color:#6d28d9;box-shadow:0 0 0 3px rgba(109,40,217,0.2);background:rgba(0,0,0,0.6)}
textarea{resize:none}
.ai-box{
 background: linear-gradient(135deg, rgba(139,92,246,0.1), rgba(56,189,248,0.1));
 border:1px dashed rgba(139,92,246,0.4);border-radius:16px;padding:16px;margin:12px 0
}
.ai-title{color:#a78bfa;font-size:13px;font-weight:700;margin-bottom:8px}
#preview{width:100%;height:240px;object-fit:cover;border-radius:16px;display:none;margin:12px 0;border:1px solid rgba(139,92,246,0.3);box-shadow:0 10px 30px rgba(0,0,0,0.5)}
#btn{
 width:100%;padding:16px;border:0;border-radius:14px;
 background: linear-gradient(90deg,#6d28d9,#38bdf8);
 color:#fff;font-weight:900;font-size:16px;cursor:pointer;
 transition:0.3s;letter-spacing:0.5px;box-shadow:0 0 20px rgba(109,40,217,0.4)
}
#btn:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(109,40,217,0.6)}
#btn:disabled{background:#222;box-shadow:none;transform:none;cursor:not-allowed}
#msg{text-align:center;margin-top:14px;font-size:14px;font-weight:700;display:none;padding:10px;border-radius:10px}
</style>
</head>
<body>
<div class="card">
<h1 class="title">MONARCH ARCHIVE</h1>
<p class="subtitle">وثق روايتك كـ Hunter في الأرشيف</p>

<label>اسم الرواية *</label>
<input id="title" placeholder="مثال: ظلال البوابة السوداء" maxlength="100">

<div style="display:flex;gap:12px">
<div style="flex:1"><label>اسم الكاتب</label><input id="author" placeholder="مجهول" maxlength="50"></div>
<div style="flex:1"><label>الرانك</label>
<select id="rank">
<option value="E">E - مبتدئ</option><option value="D">D - عادي</option><option value="C">C - محارب</option><option value="B">B - نخبة</option><option value="A">A - قوي</option><option value="S">S - أسطوري 🔥</option><option value="Monarch">Monarch 👑</option>
</select></div>
</div>

<div class="ai-box">
<div class="ai-title">✨ مولد أغلفة الـ Monarch AI</div>
<input id="aiPrompt" placeholder="اوصف الغلاف: فارس بعيون زرقاء، بوابة عملاقة...">
<button onclick="genCover()" style="width:100%;padding:10px;border-radius:10px;border:0;background:rgba(139,92,246,0.2);color:#a78bfa;font-weight:700;cursor:pointer;margin-top:6px">توليد الغلاف تلقائيا</button>
</div>

<input id="cover" placeholder="رابط الغلاف (سيظهر هنا تلقائيا)" style="font-size:12px;color:#64748b">
<img id="preview">

<label>ملخص الرواية</label>
<textarea id="summary" placeholder="لمحة سريعة تشد القارئ..." rows="2" maxlength="300"></textarea>

<label>نص الرواية *</label>
<textarea id="content" placeholder="ابدأ رحلتك هنا..." style="height:160px"></textarea>

<button id="btn" onclick="publish()">نشر في أرشيف المونارك 👑</button>
<p id="msg"></p>
</div>

<script>
function genCover(){
 let p=document.getElementById('aiPrompt').value.trim();
 if(!p) return alert('اوصف الغلاف الاول يا هانتر');
 let url=`https://image.pollinations.ai/prompt/${encodeURIComponent(p+' solo leveling monarch style, epic anime cover, dramatic lighting, ultra detailed')}`;
 document.getElementById('cover').value=url;
 let img=document.getElementById('preview'); img.src=url; img.style.display='block';
}
async function publish(){
 let btn=document.getElementById('btn'), msg=document.getElementById('msg');
 let t=title.value.trim(), authorVal=author.value.trim(), rankVal=rank.value;
 let s=summary.value.trim(), c=cover.value.trim()||'https://via.placeholder.com/600x340/1a1a2e/6d28d9?text=MONARCH', contentVal=content.value.trim();
 if(!t||!contentVal){msg.style.display='block';msg.style.background='rgba(239,68,68,0.1)';msg.style.color='#ef4444';msg.textContent='لازم اسم الرواية والمحتوى';return}
 btn.disabled=true; btn.textContent='يتم الفتح كبوابة...'; msg.style.display='none';
 let novel={title:t,author:authorVal||'Hunter مجهول',rank:rankVal,summary:s,cover:c,content:contentVal,date:new Date().toISOString(),createdAt:Date.now(),views:0,likes:0};
 try{
  await fetch('https://novels-app-2f35b-default-rtdb.firebaseio.com/novels.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(novel)});
  msg.style.display='block';msg.style.background='rgba(34,197,94,0.1)';msg.style.color='#22c55e';msg.textContent=`تم النشر كـ ${rankVal} بنجاح ✅`;
  setTimeout(()=>location.href='index.html',1200);
 }catch(e){btn.disabled=false;btn.textContent='نشر في أرشيف المونارك 👑';msg.style.display='block';msg.style.background='rgba(239,68,68,0.1)';msg.style.color='#ef4444';msg.textContent='خطأ في الاتصال بالبوابة';}
}
</script>
</body>
</html>
