<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>انشر روايتك</title>
<style>
input, textarea{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:#fff;box-sizing:border-box;font-family:inherit}
input:focus, textarea:focus{outline:none;border-color:#6d28d9}
#btn{transition:0.3s}
#btn:disabled{background:#555;cursor:not-allowed}
</style>
</head>
<body>
<div class="container" style="max-width:600px;margin:20px auto;padding:20px">
<h1 class="title">انشر روايتك</h1>

<input id="title" placeholder="اسم الرواية *" maxlength="100">
<input id="author" placeholder="اسم المؤلف" maxlength="50">
<input id="cover" placeholder="رابط صورة الغلاف (اختياري)">
<textarea id="summary" placeholder="ملخص الرواية (اختياري)" rows="3" maxlength="300"></textarea>
<textarea id="content" placeholder="اكتب الفصل هنا... *" style="height:200px"></textarea>

<button id="btn" onclick="publish()" class="read-btn" style="width:100%">نشر</button>
<p id="msg" style="text-align:center;margin-top:10px;display:none"></p>
</div>

<script>
async function publish(){
 let btn = document.getElementById('btn');
 let msg = document.getElementById('msg');
 let t = document.getElementById('title').value.trim();
 let author = document.getElementById('author').value.trim();
 let s = document.getElementById('summary').value.trim();
 let c = document.getElementById('cover').value.trim() || 'https://via.placeholder.com/300x180?text=No+Cover';
 let content = document.getElementById('content').value.trim();

 if(!t || !content){ 
   msg.style.display='block';
   msg.style.color='#ff6b6b';
   msg.textContent='لازم تكتب اسم الرواية والمحتوى';
   return; 
 }
 if(t.length < 3){
   msg.style.display='block';
   msg.style.color='#ff6b6b';
   msg.textContent='اسم الرواية قصير اوي';
   return;
 }

 btn.disabled = true;
 btn.textContent = 'جاري النشر...';
 msg.style.display='none';

 let novel = {
  title: t,
  author: author || 'مجهول',
  summary: s,
  cover: c,
  content: content,
  date: new Date().toISOString(),
  views: 0
 };

 try {
   await fetch('https://novels-app-2f35b-default-rtdb.firebaseio.com/novels.json', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(novel)
   });

   msg.style.display='block';
   msg.style.color='#22c55e';
   msg.textContent='اتنشرت عند الكل ✅';
   setTimeout(()=>{ window.location.href='index.html'; }, 1000);

 } catch(e){
   btn.disabled = false;
   btn.textContent = 'نشر';
   msg.style.display='block';
   msg.style.color='#ff6b6b';
   msg.textContent='حصل خطأ، اتأكد من النت';
 }
}
</script>
</body>
</html>
