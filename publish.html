<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><link rel="stylesheet" href="style.css">
<title>انشر روايتك</title></head>
<body><div class="container" style="max-width:600px">
<h1 class="title">انشر روايتك</h1>
<input id="title" placeholder="اسم الرواية" style="width:100%;padding:12px;margin:10px 0;border-radius:8px">
<textarea id="summary" placeholder="ملخص الرواية" style="width:100%;padding:12px;margin:10px 0;border-radius:8px"></textarea>
<input id="cover" placeholder="رابط صورة الغلاف" style="width:100%;padding:12px;margin:10px 0;border-radius:8px">
<textarea id="content" placeholder="اكتب الفصل هنا..." style="width:100%;height:200px;padding:12px;margin:10px 0;border-radius:8px"></textarea>
<button onclick="publish()" class="read-btn" style="width:100%">نشر</button>
</div>
<script>
async function publish(){
 let t = document.getElementById('title').value;
 let s = document.getElementById('summary').value;
 let c = document.getElementById('cover').value || 'https://via.placeholder.com/200';
 let content = document.getElementById('content').value;

 if(!t || !content){ alert('اكتب اسم الرواية والمحتوى'); return; }

 let novel = {
  title: t,
  summary: s,
  cover: c,
  content: content,
  date: new Date().toLocaleDateString('ar-EG')
 };

 await fetch('https://novels-app-2f35b-default-rtdb.firebaseio.com/novels.json', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(novel)
 });

 alert('اتنشرت عند الكل ✅');
 window.location.href='index.html';
}
</script></body></html>
