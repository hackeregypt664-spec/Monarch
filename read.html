<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>قراءة</title>
<style>
#cover{width:200px;height:280px;object-fit:cover;border-radius:15px;border:3px solid #38bfff;margin:20px auto;display:block}
#story-text{font-size:18px;line-height:1.9;white-space:pre-wrap;background:#1a1a1a;padding:20px;border-radius:12px;word-break:break-word}
.controls{text-align:center;margin:15px 0;display:flex;gap:10px;justify-content:center}
</style>
</head>
<body>
<div class="container" style="max-width:800px;margin:20px auto;padding:20px">
<a href="index.html" class="read-btn" style="margin:20px 0;display:inline-block">← رجوع للمكتبة</a>
<h1 id="title" class="title">بيحمل...</h1>
<img id="cover" style="display:none" />
<p id="meta" style="color:#888;text-align:center;font-size:14px"></p>
<p id="summary" class="hero-text" style="font-size:18px!important;color:#cbd5e1"></p>
<hr style="margin:20px 0;border-color:#333">
<div class="controls">
<button onclick="changeFont(2)" class="read-btn">A+ تكبير</button>
<button onclick="changeFont(-2)" class="read-btn">A- تصغير</button>
</div>
<div id="story-text">بيحمل القصة...</div>
</div>

<script>
let params = new URLSearchParams(window.location.search);
let id = params.get('id');

if(!id){
  document.getElementById('title').innerText = "رابط غلط";
  document.getElementById('story-text').innerText = "مفيش ID للرواية";
}

function escapeHtml(text){
  if(!text) return '';
  let div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

async function loadNovel(){
  try {
    let res = await fetch(`https://novels-app-2f35b-default-rtdb.firebaseio.com/novels/${id}.json`);
    let n = await res.json();

    if(!n){
      document.getElementById('title').innerText = "🗑️ الرواية دي اتمسحت";
      document.getElementById('story-text').innerText = "الادمن مسح الرواية دي، مش هتظهر عند حد تاني 🙂";
      document.getElementById('cover').style.display='none';
      document.getElementById('summary').style.display='none';
      return;
    }

    document.title = n.title + " - عالم الروايات";
    document.getElementById('title').innerText = n.title;
    
    let cover = document.getElementById('cover');
    cover.src = n.cover || 'https://via.placeholder.com/200x280?text=No+Cover';
    cover.style.display = 'block';
    cover.onerror = function(){ this.src='https://via.placeholder.com/200x280?text=No+Image'; };
    
    document.getElementById('summary').innerText = n.summary || '';
    document.getElementById('meta').innerText = `✍️ ${n.author || 'مجهول'} - 📅 ${n.date ? new Date(n.date).toLocaleDateString('ar-EG') : ''}`;
    
    // مهم: innerText مش innerHTML عشان الحماية
    document.getElementById('story-text').innerText = n.content;

  } catch(e){
    document.getElementById('title').innerText = "خطأ في التحميل";
    document.getElementById('story-text').innerText = "اتأكد من النت وحاول تاني";
  }
}

loadNovel();

let fontSize=18;
function changeFont(c){ 
  fontSize+=c;
  if(fontSize < 12) fontSize = 12;
  if(fontSize > 40) fontSize = 40;
  document.getElementById('story-text').style.fontSize=fontSize+'px'; 
}
</script>
</body>
</html>
