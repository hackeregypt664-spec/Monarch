<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>انشر روايتك - MONARCH</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
*{font-family:'Cairo',sans-serif;box-sizing:border-box}
body{background:#08080f;color:#fff;margin:0;padding:20px}
.card{background:linear-gradient(145deg, rgba(24,24,40,0.9), rgba(15,15,25,0.9));border:1px solid rgba(109,40,217,0.25);border-radius:24px;padding:24px;max-width:800px;margin:15px auto}
label{color:#94a3b8;font-size:13px;margin:14px 0 6px 0;display:block;font-weight:700}
input, textarea, select{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,0.08);background:rgba(0,0,0,0.4);color:#fff;font-size:14px}
input:focus, textarea:focus{outline:none;border-color:#6d28d9}
.tabs{display:flex;gap:8px;margin:15px 0;background:rgba(0,0,0,0.3);padding:6px;border-radius:12px}
.tab{flex:1;padding:12px;text-align:center;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px;transition:0.2s;color:#64748b}
.tab.active{background:linear-gradient(90deg,#6d28d9,#38bdf8);color:#fff;box-shadow:0 0 15px rgba(109,40,217,0.4)}
.pdf-drop{border:2px dashed rgba(109,40,217,0.3);border-radius:16px;padding:25px;text-align:center;cursor:pointer;background:rgba(109,40,217,0.05)}
.btn-main{width:100%;padding:16px;background:linear-gradient(90deg,#6d28d9,#38bdf8);border:0;border-radius:14px;color:#fff;font-weight:900;font-size:16px;margin-top:18px;cursor:pointer}
.hidden{display:none}
</style>
</head>
<body>
<div style="max-width:800px;margin:0 auto"><a href="index.html" style="color:#64748b;text-decoration:none;font-size:13px">← الرجوع للمكتبة</a></div>

<div class="card">
<h2 style="color:#a78bfa;margin:0">👑 انشر روايتك</h2>
<p style="color:#64748b;font-size:13px;margin:5px 0 15px 0">اختار الطريقة اللي تريحك</p>

<label>عنوان الرواية *</label>
<input id="title" placeholder="اسم الرواية">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div><label>المؤلف *</label><input id="author"></div>
<div><label>التصنيف</label><select id="genre"><option>فانتازيا</option><option>أكشن</option><option>مغامرة</option><option>نظام</option><option>رعب</option><option>رومانسي</option></select></div>
</div>
<label>رابط الغلاف *</label>
<input id="cover" placeholder="https://...">
<label>ملخص *</label>
<textarea id="summary" rows="3" maxlength="150" placeholder="ملخص قصير يشد"></textarea>

<div class="tabs">
<div class="tab active" id="tab-write" onclick="switchMode('write')">✍️ كتابة يدوية</div>
<div class="tab" id="tab-pdf" onclick="switchMode('pdf')">📄 رفع PDF</div>
</div>

<div id="writeMode">
<label>محتوى الرواية - اكتب هنا *</label>
<textarea id="content" rows="12" placeholder="اكتب روايتك هنا... كل فقرة دوس Enter مرتين

لو كتبت --- هتتعمل فاصل شيك"></textarea>
</div>

<div id="pdfMode" class="hidden">
<label>ارفع ملف PDF</label>
<div class="pdf-drop" onclick="document.getElementById('pdfFile').click()">
<div style="font-size:36px">📚</div>
<p style="color:#a78bfa;font-weight:700;margin:8px 0">دوس لاختيار PDF</p>
<p style="color:#475569;font-size:11px">او اسحبه هنا</p>
<input type="file" id="pdfFile" accept=".pdf" hidden onchange="handlePDF(this.files[0])">
<p id="pdfStatus" style="font-size:12px;margin-top:10px;color:#38bdf8"></p>
</div>
<label style="margin-top:15px">المحتوى المستخرج من PDF (تقدر تعدل عليه)</label>
<textarea id="contentPDF" rows="12" placeholder="النص من الـ PDF هيظهر هنا وتقدر تعدل عليه قبل النشر..."></textarea>
</div>

<button class="btn-main" onclick="publish()">نشر في الأرشيف 🚀</button>
<p id="msg" style="text-align:center;margin-top:12px;font-size:13px"></p>
</div>

<script>
let currentUser = JSON.parse(localStorage.getItem('monarch_user'));
if(!currentUser){ location.href='login.html'; } else document.getElementById('author').value=currentUser.name;
let mode='write';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function switchMode(m){
  mode=m;
  document.getElementById('tab-write').classList.toggle('active', m==='write');
  document.getElementById('tab-pdf').classList.toggle('active', m==='pdf');
  document.getElementById('writeMode').classList.toggle('hidden', m!=='write');
  document.getElementById('pdfMode').classList.toggle('hidden', m!=='pdf');
}

async function handlePDF(file){
  if(!file) return;
  let status=document.getElementById('pdfStatus');
  status.innerText='⏳ جاري قراءة PDF... '+file.name;
  try{
    let buf=await file.arrayBuffer();
    let pdf=await pdfjsLib.getDocument(buf).promise;
    let fullText='';
    for(let i=1;i<=pdf.numPages;i++){
      let page=await pdf.getPage(i);
      let txt=await page.getTextContent();
      fullText+=txt.items.map(s=>s.str).join(' ')+'\n\n';
      status.innerText=`📖 بيقرا ${i}/${pdf.numPages}...`;
      if(fullText.length>200000) break;
    }
    fullText=fullText.replace(/\s{3,}/g,'\n\n').trim();
    document.getElementById('contentPDF').value=fullText;
    status.innerText=`✅ تم استخراج ${pdf.numPages} صفحة - ${fullText.length} حرف`;
    status.style.color='#22c55e';
    if(!document.getElementById('title').value) document.getElementById('title').value=file.name.replace('.pdf','');
  }catch(e){ status.innerText='❌ فشل قراءة الملف'; status.style.color='#ef4444'; }
}

let drop=document.querySelector('.pdf-drop');
drop.addEventListener('dragover', e=>{ e.preventDefault(); drop.style.borderColor='#38bdf8'; });
drop.addEventListener('drop', e=>{ e.preventDefault(); let f=e.dataTransfer.files[0]; if(f) handlePDF(f); });

async function publish(){
  let title=document.getElementById('title').value.trim();
  let author=document.getElementById('author').value.trim();
  let cover=document.getElementById('cover').value.trim();
  let summary=document.getElementById('summary').value.trim();
  let content = mode==='write' ? document.getElementById('content').value.trim() : document.getElementById('contentPDF').value.trim();
  let genre=document.getElementById('genre').value;
  let msg=document.getElementById('msg');
  if(!title||!author||!cover||!summary||!content) return msg.innerText='❌ كمل كل الخانات', msg.style.color='#ef4444';
  msg.style.color='#a78bfa'; msg.innerText='🚀 جاري النشر...';
  try{
    let res=await fetch('https://novels-app-2f35b-default-rtdb.firebaseio.com/novels.json',{method:'POST',body:JSON.stringify({title,author,cover,summary,content,genre,likes:0,views:0,rank:'E',createdAt:Date.now(),date:new Date().toISOString(),publisherId:currentUser.id,publisherName:currentUser.name,source:mode})});
    if(res.ok){ msg.style.color='#22c55e'; msg.innerText='✅ تم النشر!'; setTimeout(()=>location.href='index.html',1000); }
  }catch(e){ msg.innerText='❌ خطأ'; }
}
</script>
</body>
</html>
