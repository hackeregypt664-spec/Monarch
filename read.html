<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قراءة - Monarch</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
*{font-family:'Cairo',sans-serif}
body{background:#08080f;color:#fff;margin:0}
#progress-bar{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,#6d28d9,#38bdf8);width:0%;z-index:9999}
.top-bar{position:sticky;top:4px;z-index:10;background:rgba(8,8,15,0.9);backdrop-filter:blur(20px);padding:12px;border-bottom:1px solid rgba(109,40,217,0.15);display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
#cover{width:230px;height:330px;object-fit:cover;border-radius:20px;border:1px solid rgba(109,40,217,0.3);margin:20px auto;display:block}
.rank-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;background:rgba(109,40,217,0.15);border:1px solid rgba(109,40,217,0.3);color:#a78bfa}
#bookmark-fab{position:fixed;bottom:25px;left:25px;background:linear-gradient(90deg,#6d28d9,#38bdf8);color:#fff;border:0;border-radius:50%;width:56px;height:56px;font-size:22px;cursor:pointer;z-index:99}
#bookmark-modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);display:none;justify-content:center;align-items:center;z-index:100}
.modal-box{background:#181828;border:1px solid rgba(109,40,217,0.3);padding:24px;border-radius:20px;text-align:center;max-width:340px;width:90%}
.comment-box{background:rgba(255,255,255,0.03);padding:12px;border-radius:12px;margin:8px 0;border:1px solid rgba(255,255,255,0.04)}

/* === تعليم الكلمة === */
#story-text p{font-size:19px;line-height:2.3;color:#d1d5db;margin:18px 0;text-align:justify;word-spacing:3px}
.word{cursor:pointer;padding:2px 3px;border-radius:6px;transition:0.15s}
.word:hover{background:rgba(109,40,217,0.2)}
.word.marked{background:#facc15 !important;color:#000 !important;font-weight:700;box-shadow:0 0 10px rgba(250,204,21,0.5);border-radius:4px}
.marks-panel{position:fixed;bottom:90px;left:25px;background:#181828;border:1px solid rgba(250,204,21,0.3);border-radius:14px;padding:12px;width:220px;z-index:98;display:none;max-height:300px;overflow-y:auto}
</style>
</head>
<body>
<div id="progress-bar"></div>
<div class="top-bar">
<a href="index.html" style="background:rgba(255,255,255,0.06);padding:8px 14px;border-radius:20px;color:#fff;text-decoration:none;font-size:13px">← المكتبة</a>
<button onclick="changeFont(2)" style="padding:8px 12px;border-radius:20px;border:1px solid #333;background:#000;color:#fff;cursor:pointer">A+</button>
<button onclick="changeFont(-2)" style="padding:8px 12px;border-radius:20px;border:1px solid #333;background:#000;color:#fff;cursor:pointer">A-</button>
<span id="progressText" style="color:#a78bfa;padding:8px 12px;background:rgba(109,40,217,0.1);border-radius:20px;font-size:12px">0%</span>
<button onclick="likeNovel()" style="padding:8px 14px;border-radius:20px;border:0;background:rgba(255,255,255,0.06);color:#fff;cursor:pointer">❤️ <span id="likeCount">0</span></button>
</div>

<div style="max-width:800px;margin:20px auto;padding:20px">
<h1 id="title" style="color:#fff;text-align:center;font-weight:900">بيحمل...</h1>
<img id="cover" style="display:none" />
<p id="meta" style="color:#64748b;text-align:center;font-size:13px;margin:10px 0"></p>
<div style="background:rgba(250,204,21,0.08);border:1px solid rgba(250,204,21,0.2);border-radius:10px;padding:10px;text-align:center;color:#facc15;font-size:12px;margin:10px 0">💡 دوس على أي <b>كلمة</b> علشان تعلمها 🖍️</div>
<div id="story-text" style="background:rgba(24,24,40,0.5);padding:24px;border-radius:20px;border:1px solid rgba(255,255,255,0.04)"></div>
</div>

<button id="bookmark-fab" onclick="saveBookmarkManual()">🔖</button>
<div id="marks-panel" class="marks-panel"></div>
<div id="bookmark-modal"><div class="modal-box"><p id="bm-text" style="color:#cbd5e1"></p><div style="display:flex;gap:10px;margin-top:15px"><button onclick="resumeRead()" style="flex:1;padding:12px;background:#6d28d9;border:0;border-radius:12px;color:#fff;cursor:pointer">كمل قراءة</button><button onclick="closeBm()" style="flex:1;padding:12px;background:rgba(255,255,255,0.06);border:0;border-radius:12px;color:#fff;cursor:pointer">من الأول</button></div></div></div>

<script>
let params = new URLSearchParams(window.location.search);
let id = params.get('id');
const DB = `https://novels-app-2f35b-default-rtdb.firebaseio.com/novels/${id}`;
let currentUser = JSON.parse(localStorage.getItem('monarch_user'));
if(!currentUser){ localStorage.setItem('monarch_next','read.html?id='+id); location.href='login.html'; }

function escapeHtml(text){ if(!text) return ''; let div=document.createElement('div'); div.textContent=text; return div.innerHTML; }
function getBmKey(){ return `bookmark_${currentUser ? currentUser.id+'_' : ''}${id}` }
function getProgressKey(){ return `progress_${currentUser ? currentUser.id+'_' : ''}${id}` }
function getWordMarksKey(){ return `wordmarks_${currentUser ? currentUser.id+'_' : ''}${id}` }

function formatContent(text){
  if(!text) return '';
  let marks = JSON.parse(localStorage.getItem(getWordMarksKey()) || '[]');
  // marks = ["0-5", "2-10"] => para 0 word 5
  
  return text.split(/\n\s*\n/).map((p, pIdx)=>{
    p=p.trim(); if(!p) return '';
    if(p==='---') return `<div style="text-align:center;color:#6d28d9;margin:30px 0;letter-spacing:8px">• • •</div>`;
    
    // قسم الفقرة لكلمات
    let words = p.split(/(\s+)/); // يحافظ على المسافات
    let html = '';
    let wIdx = 0;
    words.forEach(w=>{
      if(w.trim()===''){
        html += w; // مسافة
      } else {
        let key = `${pIdx}-${wIdx}`;
        let isMarked = marks.includes(key);
        html += `<span class="word ${isMarked?'marked':''}" data-key="${key}" onclick="toggleWord('${key}', this)">${escapeHtml(w)}</span>`;
        wIdx++;
      }
    });
    return `<p>${html}</p>`;
  }).join('');
}

function toggleWord(key, el){
  let marks = JSON.parse(localStorage.getItem(getWordMarksKey()) || '[]');
  let idx = marks.indexOf(key);
  if(idx > -1){
    marks.splice(idx,1);
    el.classList.remove('marked');
  } else {
    marks.push(key);
    el.classList.add('marked');
  }
  localStorage.setItem(getWordMarksKey(), JSON.stringify(marks));
  updateWordPanel();
}

function updateWordPanel(){
  let marks = JSON.parse(localStorage.getItem(getWordMarksKey()) || '[]');
  let panel = document.getElementById('marks-panel');
  if(marks.length===0){ panel.style.display='none'; return; }
  panel.style.display='block';
  
  // جيب نص الكلمات المعلمة
  let words = [];
  marks.forEach(k=>{
    let el = document.querySelector(`[data-key="${k}"]`);
    if(el) words.push(el.innerText);
  });
  
  panel.innerHTML = `<div style="color:#facc15;font-size:12px;font-weight:700">🖍️ كلماتك (${marks.length})</div>
  <div style="display:flex;flex-wrap:wrap;gap:4px;margin:8px 0">${words.map(w=>`<span style="background:#facc15;color:#000;padding:2px 6px;border-radius:6px;font-size:11px">${escapeHtml(w)}</span>`).join('')}</div>
  <div onclick="clearWords()" style="color:#ef4444;font-size:11px;text-align:center;cursor:pointer;background:rgba(239,68,68,0.1);padding:4px;border-radius:6px">مسح الكل</div>`;
}
function clearWords(){ if(confirm('تمسح كل الكلمات؟')){ localStorage.removeItem(getWordMarksKey()); document.querySelectorAll('.word.marked').forEach(e=>e.classList.remove('marked')); updateWordPanel(); } }

function saveProgress(){
  let scroll = window.scrollY; let total = document.body.scrollHeight - window.innerHeight;
  let percent = total>0 ? Math.round((scroll/total)*100) : 0;
  localStorage.setItem(getBmKey(), scroll); localStorage.setItem(getProgressKey(), percent);
  document.getElementById('progressText').innerText = percent+'%'; document.getElementById('progress-bar').style.width = percent+'%';
}
function saveBookmarkManual(){ saveProgress(); let b=document.getElementById('bookmark-fab'); b.innerText='✅'; setTimeout(()=>b.innerText='🔖',1000); }
function resumeRead(){ let pos=localStorage.getItem(getBmKey()); if(pos) window.scrollTo({top:parseInt(pos), behavior:'smooth'}); closeBm(); }
function closeBm(){ document.getElementById('bookmark-modal').style.display='none'; }
function checkBookmark(){ let pos=localStorage.getItem(getBmKey()); let prog=localStorage.getItem(getProgressKey()); if(pos && parseInt(pos)>300){ document.getElementById('bm-text').innerText=`وقفت عند ${prog||0}%، تكمل؟`; document.getElementById('bookmark-modal').style.display='flex'; } }

async function loadNovel(){
  let res=await fetch(`${DB}.json`); let n=await res.json();
  if(!n){ document.getElementById('title').innerText="اتمسحت"; return; }
  document.getElementById('title').innerText=n.title;
  let cover=document.getElementById('cover'); cover.src=n.cover; cover.style.display='block';
  document.getElementById('meta').innerHTML=`✍️ ${escapeHtml(n.author||'مجهول')} - 👁️ ${n.views||0}`;
  document.getElementById('story-text').innerHTML=formatContent(n.content);
  document.getElementById('likeCount').innerText=n.likes||0;
  fetch(`${DB}.json`,{method:'PATCH',body:JSON.stringify({views:(n.views||0)+1})});
  setTimeout(checkBookmark,800); window.addEventListener('scroll', saveProgress);
  updateWordPanel();
}
async function likeNovel(){ if(localStorage.getItem('liked_'+id)) return alert('عملت لايك قبل كده'); let r=await fetch(`${DB}.json`); let n=await r.json(); let nl=(n.likes||0)+1; await fetch(`${DB}.json`,{method:'PATCH',body:JSON.stringify({likes:nl})}); document.getElementById('likeCount').innerText=nl; localStorage.setItem('liked_'+id,'1'); }
loadNovel();
let fontSize=19;
function changeFont(c){ fontSize+=c; if(fontSize<14) fontSize=14; if(fontSize>32) fontSize=32; document.querySelectorAll('#story-text p').forEach(p=>p.style.fontSize=fontSize+'px'); }
</script>
</body>
</html>
