<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>قراءة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
*{font-family:'Cairo', sans-serif}
body{background:#08080f !important}
#progress-bar{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,#6d28d9,#38bdf8);width:0%;z-index:9999;transition:0.2s;box-shadow:0 0 10px #6d28d9}
.top-bar{position:sticky;top:4px;z-index:10;background:rgba(8,8,15,0.85);backdrop-filter:blur(20px);padding:12px 0;border-bottom:1px solid rgba(109,40,217,0.15);display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
#cover{width:220px;height:320px;object-fit:cover;border-radius:20px;border:1px solid rgba(109,40,217,0.3);margin:20px auto;display:block;box-shadow:0 20px 40px rgba(0,0,0,0.5)}
#story-text{
 font-size:18px;line-height:2.2;white-space:pre-wrap;
 background: linear-gradient(145deg, rgba(24,24,40,0.6), rgba(15,15,25,0.6));
 padding:28px;border-radius:20px;word-break:break-word;
 border:1px solid rgba(255,255,255,0.05);
 box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
}
.rank-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;background:rgba(109,40,217,0.15);border:1px solid rgba(109,40,217,0.3);color:#a78bfa;margin:0 5px}
.comment-box{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);padding:12px;border-radius:12px;margin:8px 0}
.like-active{background:linear-gradient(90deg,#ef4444,#f59e0b) !important}
#bookmark-modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:10000;padding:20px}
#bookmark-modal .box{background:#181828;border:1px solid #6d28d9;border-radius:20px;padding:25px;max-width:360px;width:100%;text-align:center;box-shadow:0 0 50px rgba(109,40,217,0.3)}
#bookmark-fab{position:fixed;bottom:25px;left:25px;background:linear-gradient(90deg,#6d28d9,#38bdf8);color:#fff;border:0;border-radius:50%;width:56px;height:56px;font-size:22px;cursor:pointer;box-shadow:0 0 20px rgba(109,40,217,0.5);z-index:99}
</style>
</head>
<body>
<div id="progress-bar"></div>
<div id="bookmark-modal">
  <div class="box">
    <h3 style="color:#a78bfa;margin:0 0 10px 0">🔖 لقيت علامة!</h3>
    <p id="bm-text" style="color:#94a3b8;font-size:14px"></p>
    <div style="display:flex;gap:10px;margin-top:15px">
      <button onclick="resumeRead()" style="flex:1;padding:12px;border:0;border-radius:10px;background:linear-gradient(90deg,#6d28d9,#38bdf8);color:#fff;font-weight:900;cursor:pointer">اكمل من هنا</button>
      <button onclick="closeBm()" style="flex:1;padding:12px;border:1px solid #333;border-radius:10px;background:transparent;color:#64748b;cursor:pointer">ابدأ من جديد</button>
    </div>
  </div>
</div>

<button id="bookmark-fab" onclick="saveBookmarkManual()" title="حفظ مكانك">🔖</button>

<div class="top-bar">
<a href="index.html" class="read-btn" style="background:rgba(255,255,255,0.06);padding:8px 14px;border-radius:20px;color:#fff;text-decoration:none;font-size:13px">← المكتبة</a>
<button onclick="changeFont(2)" class="read-btn" style="padding:8px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.3);color:#fff;cursor:pointer">A+</button>
<button onclick="changeFont(-2)" class="read-btn" style="padding:8px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.3);color:#fff;cursor:pointer">A-</button>
<span id="readTime" style="color:#38bdf8;padding:8px 12px;background:rgba(56,189,248,0.1);border-radius:20px;font-size:12px"></span>
<span id="progressText" style="color:#a78bfa;padding:8px 12px;background:rgba(109,40,217,0.1);border-radius:20px;font-size:12px">0%</span>
<button id="likeBtn" onclick="likeNovel()" class="read-btn" style="padding:8px 14px;border-radius:20px;border:0;background:rgba(255,255,255,0.06);color:#fff;cursor:pointer">❤️ <span id="likeCount">0</span></button>
</div>

<div class="container" style="max-width:800px;margin:20px auto;padding:20px">
<h1 id="title" class="title" style="color:#a78bfa;text-align:center">بيحمل...</h1>
<img id="cover" style="display:none" />
<p id="meta" style="color:#64748b;text-align:center;font-size:13px;margin:10px 0"></p>
<p id="summary" style="font-size:16px;color:#94a3b8;text-align:center;background:rgba(109,40,217,0.08);padding:14px;border-radius:12px;border:1px solid rgba(109,40,217,0.15)"></p>
<hr style="margin:20px 0;border:0;border-top:1px solid rgba(255,255,255,0.06)">
<div id="story-text">بيحمل القصة...</div>

<div style="margin-top:40px">
<h3 style="color:#e2e8f0">💬 تعليقات الهانترز <span id="cCount" style="color:#6d28d9"></span></h3>
<div style="display:flex;gap:8px;margin:12px 0">
<input id="cName" placeholder="اسمك" style="width:25%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:rgba(0,0,0,0.4);color:#fff">
<input id="cText" placeholder="قول رأيك..." style="flex:1;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:rgba(0,0,0,0.4);color:#fff">
<button onclick="addComment()" class="read-btn" style="padding:12px 18px;border-radius:12px;border:0;background:#6d28d9;color:#fff;cursor:pointer">نشر</button>
</div>
<div id="commentsList"></div>
</div>
</div>

<script>
let params = new URLSearchParams(window.location.search);
let id = params.get('id');
const DB = `https://novels-app-2f35b-default-rtdb.firebaseio.com/novels/${id}`;
let currentNovel = null;
let currentUser = JSON.parse(localStorage.getItem('monarch_user'));

function escapeHtml(text){ if(!text) return ''; let div=document.createElement('div'); div.textContent=text; return div.innerHTML; }

// --- BOOKMARK SYSTEM ---
function getBmKey(){ return `bookmark_${currentUser ? currentUser.id+'_' : ''}${id}` }
function getProgressKey(){ return `progress_${currentUser ? currentUser.id+'_' : ''}${id}` }

function saveProgress(){
  let scroll = window.scrollY;
  let total = document.body.scrollHeight - window.innerHeight;
  let percent = total>0 ? Math.round((scroll/total)*100) : 0;
  localStorage.setItem(getBmKey(), scroll);
  localStorage.setItem(getProgressKey(), percent);
  document.getElementById('progressText').innerText = percent+'%';
  document.getElementById('progress-bar').style.width = percent+'%';
}

function saveBookmarkManual(){
  saveProgress();
  let btn = document.getElementById('bookmark-fab');
  btn.innerText = '✅'; setTimeout(()=>btn.innerText='🔖',1500);
}

function resumeRead(){
  let pos = localStorage.getItem(getBmKey());
  if(pos) window.scrollTo({top:parseInt(pos), behavior:'smooth'});
  closeBm();
}
function closeBm(){ document.getElementById('bookmark-modal').style.display='none'; localStorage.removeItem(getBmKey()); }

function checkBookmark(){
  let pos = localStorage.getItem(getBmKey());
  let prog = localStorage.getItem(getProgressKey());
  if(pos && parseInt(pos) > 300){
    document.getElementById('bm-text').innerText = `انت وقفت عند ${prog||0}% من الرواية، تحب تكمل؟`;
    document.getElementById('bookmark-modal').style.display='flex';
  }
}

async function loadNovel(){
  try {
    let res = await fetch(`${DB}.json`);
    let n = await res.json();
    if(!n){ document.getElementById('title').innerText="🗑️ الرواية اتمسحت"; document.getElementById('story-text').innerText="مش موجودة"; return; }
    currentNovel=n;
    document.title=n.title+" - Monarch";
    document.getElementById('title').innerText=n.title;
    let cover=document.getElementById('cover'); cover.src=n.cover; cover.style.display='block';
    cover.onerror=()=>cover.src='https://via.placeholder.com/200x280?text=No+Image';
    document.getElementById('summary').innerText=n.summary||'';
    document.getElementById('summary').style.display=n.summary?'block':'none';
    let rankHtml=n.rank?`<span class="rank-badge">${n.rank}</span>`:'';
    document.getElementById('meta').innerHTML=`${rankHtml} ✍️ ${escapeHtml(n.author||'مجهول')} - 📅 ${n.date?new Date(n.date).toLocaleDateString('ar-EG'):''} - 👁️ ${n.views||0}`;
    document.getElementById('story-text').innerText=n.content;
    document.getElementById('likeCount').innerText=n.likes||0;
    let wc=n.content.split(/\s+/).length;
    document.getElementById('readTime').innerText=`⏱️ ${Math.ceil(wc/200)} دقايق`;
    fetch(`${DB}.json`,{method:'PATCH',body:JSON.stringify({views:(n.views||0)+1})});
    loadComments();
    // شغل نظام العلامة بعد التحميل
    setTimeout(checkBookmark, 800);
    window.addEventListener('scroll', saveProgress);
    if(currentUser) document.getElementById('cName').value=currentUser.name;
  } catch(e){ document.getElementById('title').innerText="خطأ في التحميل"; }
}

async function likeNovel(){ if(!currentNovel) return; if(localStorage.getItem('liked_'+id)) return alert('عامل لايك قبل كده 😅'); let newLikes=(currentNovel.likes||0)+1; await fetch(`${DB}.json`,{method:'PATCH',body:JSON.stringify({likes:newLikes})}); document.getElementById('likeCount').innerText=newLikes; localStorage.setItem('liked_'+id,'1'); }
async function addComment(){ let name=document.getElementById('cName').value.trim()||(currentUser?currentUser.name:'Hunter'); let text=document.getElementById('cText').value.trim(); if(!text) return; await fetch(`${DB}/comments.json`,{method:'POST',body:JSON.stringify({name,text,time:Date.now()})}); document.getElementById('cText').value=''; loadComments(); }
async function loadComments(){ let res=await fetch(`${DB}/comments.json`); let data=await res.json(); let list=document.getElementById('commentsList'); let count=document.getElementById('cCount'); if(!data){list.innerHTML='<p style="color:#475569;text-align:center;padding:20px">كن أول هانتر يعلق 🔥</p>'; count.innerText=''; return;} let html=''; let c=0; for(let k in data){ c++; let x=data[k]; html=`<div class="comment-box"><b style="color:#a78bfa">${escapeHtml(x.name)}</b><span style="color:#475569;font-size:11px"> - ${new Date(x.time).toLocaleDateString('ar-EG')}</span><div style="margin-top:6px;color:#cbd5e1">${escapeHtml(x.text)}</div></div>`+html; } list.innerHTML=html; count.innerText=`(${c})`; }

loadNovel();
let fontSize=18;
function changeFont(c){ fontSize+=c; if(fontSize<12) fontSize=12; if(fontSize>40) fontSize=40; document.getElementById('story-text').style.fontSize=fontSize+'px'; }
</script>
</body>
</html>
